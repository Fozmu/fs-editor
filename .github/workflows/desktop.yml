name: Desktop build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a release to Fozmu/fs-editor-releases'
        type: boolean
        default: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Publishing on main is idempotent: electron-builder only creates a release when
      # package.json's version has no published release yet, so bump the version to ship.
      - name: Build installer
        if: ${{ !(github.event_name == 'push' || inputs.publish) }}
        run: npx electron-builder --win --x64 --publish never
      - name: Build and publish release
        if: ${{ github.event_name == 'push' || inputs.publish }}
        shell: bash
        # Failures are re-emitted as an annotation so they're readable without the raw log.
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::RELEASES_TOKEN secret is missing or empty"; exit 1; fi
          # electron-builder races its own parallel uploads when it has to create the release
          # (422 "Published releases must have a valid tag"), so create it up front as a draft.
          tag="v$(node -p "require('./package.json').version")"
          repo=Fozmu/fs-editor-releases
          gh release view "$tag" -R "$repo" >/dev/null 2>&1 || gh release create "$tag" -R "$repo" --draft --title "${tag#v}" --notes ""
          set +e
          npx electron-builder --win --x64 --publish always 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            msg=$(grep -v '^\s*$' build.log | tail -n 25 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=electron-builder failed::$msg"
            exit $code
          fi
          gh release edit "$tag" -R "$repo" --draft=false
        env:
          # Fine-grained token with Contents: read & write on Fozmu/fs-editor-releases
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: FS-Editor-Windows
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error
